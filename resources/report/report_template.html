  --grid: rgba(0,0,0,.07); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(20,20,40,.06);

}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111116; --surface: #1b1b22; --surface-2: #23232c; --border: #2d2d38;
    --text: #ececf2; --muted: #9a9aab; --faint: #6c6c7c;
    --grid: rgba(255,255,255,.07); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --b-loading: #3b4252; --b-background: #2a2a33;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);

.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 64px; }
h1, h2, h3 { margin: 0; line-height: 1.2; }

section { margin-top: 18px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }

.hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; position: relative; overflow: hidden; }
.hero::before {

.game { font-size: clamp(26px, 4vw, 40px); font-weight: 750; margin: 10px 0 6px; letter-spacing: -.02em; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.chip b { font-weight: 600; }
.grade { position: relative; width: 150px; height: 150px; flex: none; }
.grade svg { width: 150px; height: 150px; transform: rotate(-90deg); }
.grade .letter { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.grade .letter strong { display: block; font-size: 52px; font-weight: 800; line-height: 1; }
.grade .letter span { font-size: 12px; color: var(--muted); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

.chart-head .keys span { display: inline-flex; align-items: center; gap: 6px; }
.chart-head .keys i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

.donut { width: 220px; height: 220px; position: relative; }

@media (max-width: 900px) {

@media print {

  .card { box-shadow: none; break-inside: avoid; }

    });
    // grid + y labels
    g.font = "11px Segoe UI, system-ui, sans-serif"; g.fillStyle = css("--faint"); g.strokeStyle = css("--grid"); g.lineWidth = 1;
    const ticks = 4;
    for (let i = 0; i <= ticks; i++) {
      const v = yMin + (yMax - yMin) * i / ticks, y = Math.round(scaleY(v)) + .5;
      g.beginPath(); g.moveTo(pad.l, y); g.lineTo(W - pad.r, y); g.stroke();
      g.textAlign = "right"; g.textBaseline = "middle";
      g.fillText(nf(v, (yMax - yMin) < 5 ? 1 : 0) + (opt.unit || ""), pad.l - 6, y);
    }
    // x labels
    g.textAlign = "center"; g.textBaseline = "top";
    const xticks = Math.max(2, Math.min(8, Math.floor(pw / 110)));
    for (let i = 0; i <= xticks; i++) {
      const t = x0 + (x1 - x0) * i / xticks;
      g.fillText(fmtT(t), Math.min(Math.max(scaleX(t), pad.l + 18), W - pad.r - 18), H - pad.b + 6);
    }
    // band
    if (opt.band) {
      // One polygon per contiguous segment so gaps stay empty.
      g.fillStyle = opt.band.color;
      let from = 0;
      for (let i = 1; i <= n; i++) {
        if (i < n && !isGap(i)) continue;
        g.beginPath();
        for (let j = from; j < i; j++) { const X = scaleX(xs[j]), Y = scaleY(Math.min(opt.band.hi[j], yMax)); j === from ? g.moveTo(X, Y) : g.lineTo(X, Y); }
        for (let j = i - 1; j >= from; j--) g.lineTo(scaleX(xs[j]), scaleY(opt.band.lo[j]));
        g.closePath(); g.fill();
        from = i;
      }
    }
    // series
    opt.series.forEach((s) => {
      g.strokeStyle = s.color; g.lineWidth = s.width || 1.6; g.setLineDash(s.dash || []); g.lineJoin = "round";
      if (s.fill) {
        g.fillStyle = s.fill; g.beginPath(); let first = -1;
        for (let i = 0; i < n; i++) { const v = s.values[i]; if (v == null) continue; const X = scaleX(xs[i]); if (first < 0) { first = i; g.moveTo(X, scaleY(yMin)); } g.lineTo(X, scaleY(v)); }
        if (first >= 0) { g.lineTo(scaleX(xs[n - 1]), scaleY(yMin)); g.closePath(); g.fill(); }
      }
      g.beginPath(); let pen = false;
      for (let i = 0; i < n; i++) {
        const v = s.values[i];
        if (v == null) { pen = false; continue; }
        if (isGap(i)) pen = false;
        const X = scaleX(xs[i]), Y = scaleY(Math.min(v, yMax));
        pen ? g.lineTo(X, Y) : g.moveTo(X, Y); pen = true;
      }
      g.stroke(); g.setLineDash([]);
    });
    // reference lines
    (opt.hLines || []).forEach((h) => {
      const y = Math.round(scaleY(h.y)) + .5;
      g.strokeStyle = h.color; g.setLineDash([5, 4]); g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(pad.l, y); g.lineTo(W - pad.r, y); g.stroke(); g.setLineDash([]);
      g.fillStyle = h.color; g.textAlign = "right"; g.textBaseline = "bottom"; g.fillText(h.label, W - pad.r - 4, y - 3);
    });
    // markers (stutters)
    (opt.markers || []).forEach((m) => {
      const X = scaleX(m.x);
      g.fillStyle = m.color; g.beginPath();
      g.moveTo(X, pad.t + 1); g.lineTo(X - 4, pad.t - 5 + 1); g.lineTo(X + 4, pad.t - 5 + 1); g.closePath();
      g.globalAlpha = .9; g.fill(); g.globalAlpha = .25; g.fillRect(X - .5, pad.t, 1, ph); g.globalAlpha = 1;
    });
    // categorical strip
    if (opt.strip) {
      const y = H - pad.b + 22, h = 10;
      for (let i = 0; i < n; i++) {
        const a = scaleX(i ? (xs[i - 1] + xs[i]) / 2 : xs[0]), b = scaleX(i < n - 1 ? (xs[i] + xs[i + 1]) / 2 : xs[n - 1]);
        g.fillStyle = opt.strip.color(i); g.fillRect(a, y, Math.max(1, b - a + .5), h);
      }
    }
    // hover
    if (hover >= 0 && hover < n) {
      const X = Math.round(scaleX(xs[hover])) + .5;
      g.strokeStyle = css("--muted"); g.lineWidth = 1; g.beginPath(); g.moveTo(X, pad.t); g.lineTo(X, H - pad.b); g.stroke();
      opt.series.forEach((s) => {
        const v = s.values[hover]; if (v == null) return;
        g.fillStyle = s.color; g.beginPath(); g.arc(X, scaleY(Math.min(v, yMax)), 3.5, 0, Math.PI * 2); g.fill();
      });
    }
  }
  function onMove(ev) {
    if (!n) return;
    const r = canvas.getBoundingClientRect(), mx = ev.clientX - r.left;
    const t = x0 + (mx - pad.l) / (W - pad.l - pad.r) * (x1 - x0);
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; xs[mid] < t ? lo = mid : hi = mid; }
    hover = Math.abs(xs[lo] - t) < Math.abs(xs[hi] - t) ? lo : hi;
    draw();
    const rows = opt.series.map((s) => `<div class="r"><span class="dot" style="background:${s.color}"></span>${esc(s.label)}<b>${s.values[hover] == null ? T("na") : nf(s.values[hover], s.decimals ?? 0) + (s.unit || opt.unit || "")}</b></div>`);
    if (opt.extraTip) rows.push(opt.extraTip(hover));
    tip.innerHTML = `<div class="t">${fmtT(xs[hover])}</div>` + rows.join("");
    tip.style.opacity = 1;
    const X = scaleX(xs[hover]);
    tip.style.left = Math.min(Math.max(8, X + 12), W - tip.offsetWidth - 8) + "px";
    tip.style.top = "8px";
  }
  canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("mouseleave", () => { hover = -1; tip.style.opacity = 0; draw(); });
  new ResizeObserver(() => draw()).observe(box);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  draw();
}

function barChart(host, { labels, values, color, height = 180, unit = "", highlight }) {
  const box = el("div", { class: "chart" }); const canvas = el("canvas"); box.append(canvas); host.append(box);
  function draw() {
    const dpr = window.devicePixelRatio || 1, W = box.clientWidth, H = height;
    canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.height = H + "px";
    const g = canvas.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pad = { l: 8, r: 8, t: 8, b: 24 }, pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
    const max = Math.max(...values, 1), bw = pw / values.length;
    values.forEach((v, i) => {
      const h = v / max * ph;
      g.fillStyle = highlight && highlight(i) ? css("--bad") : color;
      g.globalAlpha = .9; g.fillRect(pad.l + i * bw + 1, pad.t + ph - h, Math.max(1, bw - 2), h); g.globalAlpha = 1;
    });
    g.fillStyle = css("--faint"); g.font = "11px Segoe UI, system-ui"; g.textAlign = "center"; g.textBaseline = "top";
    const step = Math.ceil(values.length / Math.max(2, Math.floor(pw / 60)));
    for (let i = 0; i < values.length; i += step) g.fillText(labels[i] + unit, pad.l + i * bw + bw / 2, H - pad.b + 6);
  }
  new ResizeObserver(draw).observe(box); draw();
}

function donut(host, parts, centerHtml) {
  const total = parts.reduce((a, p) => a + p.value, 0) || 1;
  let acc = 0; const r = 80, c = 2 * Math.PI * r;
  const arcs = parts.map((p) => {
    const len = p.value / total * c, off = acc; acc += len;
    return `<circle r="${r}" cx="110" cy="110" fill="none" stroke="${p.color}" stroke-width="26" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" />`;
  }).join("");
  host.innerHTML = `<div class="donut"><svg viewBox="0 0 220 220" width="220" height="220" style="transform:rotate(-90deg)"><circle r="${r}" cx="110" cy="110" fill="none" stroke="${css("--surface-2")}" stroke-width="26"/>${arcs}</svg><div class="center">${centerHtml}</div></div>`;
}

function kpis() {
  const minutes = Math.max((F.active_sec || 0) / 60, 1 / 60);
  const items = [];
  if (has("fps")) {
    items.push([T("avgFps"), nf(F.avg_fps, 1), "", `${nf(F.count)} ${T("frames")}`]);
    items.push([T("medianFps"), nf(F.median_fps, 1), "", ""]);
  }
  if (has("one_percent_low")) {
    items.push([T("low1"), nf(F.low1_fps, 1), "", `avg ${nf(F.low1_avg_fps, 1)}`]);
    items.push([T("low01"), nf(F.low01_fps, 1), "", ""]);
  }
  if (has("frametime")) items.push([T("ftMedian"), nf(F.ft_median, 2), "ms", `p99 ${nf(F.ft_p99, 1)} ms`]);
  items.push([T("stutters"), nf(D.stutters.length), "", `${nf(D.stutters.length / minutes, 2)}${T("perMin")}`]);
  items.push([T("energy"), nf(D.energy.total_wh, D.energy.total_wh < 100 ? 1 : 0), "Wh", `${nf(D.energy.avg_w)} W ${T("avg")}`]);
  if (D.energy.fps_per_watt) items.push([T("fpsPerWatt"), nf(D.energy.fps_per_watt, 2), "", `${energyPerFrame(D.energy.mj_per_frame)}/frame`]);
  const sec = el("section", { class: "kpis" });
  sec.innerHTML = items.map(([l, v, u, s]) => `<div class="card kpi"><div class="label">${l}</div><div class="value">${v}<small>${u}</small></div><div class="sub">${s}</div></div>`).join("");
  app.append(sec);
}

function alerts() {
  const ch = D.channels || {}, out = [], pt = LANG !== "en";
  const peak = (k) => ch[k] && ch[k].max;
  if (peak("gpu_hotspot") >= 100) out.push(["bad", pt ? `Hotspot da GPU chegou a ${nf(peak("gpu_hotspot"))} °C.` : `GPU hotspot reached ${nf(peak("gpu_hotspot"))} °C.`]);
  if (peak("vram_temperature") >= 100) out.push(["bad", pt ? `Temperatura da VRAM (junction) chegou a ${nf(peak("vram_temperature"))} °C: GDDR6X começa a reduzir desempenho perto de 110 °C.` : `VRAM junction temperature reached ${nf(peak("vram_temperature"))} °C: GDDR6X throttles near 110 °C.`]);
  if (peak("cpu_temperature") && hw.cpu_tjmax && peak("cpu_temperature") >= hw.cpu_tjmax - 3) out.push(["bad", pt ? `CPU encostou no limite térmico (${nf(peak("cpu_temperature"))} °C de ${nf(hw.cpu_tjmax)} °C).` : `CPU touched its thermal limit (${nf(peak("cpu_temperature"))} °C of ${nf(hw.cpu_tjmax)} °C).`]);
  if (ch.vram_usage_percent && ch.vram_usage_percent.max >= 92) out.push(["warn", pt ? `VRAM chegou a ${nf(ch.vram_usage_percent.max)}% de uso.` : `VRAM peaked at ${nf(ch.vram_usage_percent.max)}% usage.`]);
  if (info.etw_events_lost > 0) out.push(["warn", pt ? `${nf(info.etw_events_lost)} eventos ETW perdidos: o FPS pode estar levemente subestimado.` : `${nf(info.etw_events_lost)} ETW events lost: FPS may be slightly underestimated.`]);
  if (D.stutters.length && D.stutters.length / Math.max(1, (F.active_sec || 1) / 60) > 3) out.push(["warn", pt ? "Muitos stutters por minuto: compilação de shaders e streaming de assets são suspeitos comuns, e o primeiro minuto após um update costuma ser o pior." : "Many stutters per minute: shader compilation and asset streaming are the usual suspects, and the first session after an update is often the worst."]);
  return out;
}

  const bn = D.bottleneck, off = bn.offender;

    </div>`;
  app.append(sec);
}

function backgroundSpans() {
  const spans = [], t = S.t || [], fg = S.foreground || [];
  let from = null;
  for (let i = 0; i < t.length; i++) {
    if (!fg[i] && from === null) from = i ? t[i - 1] : 0;
    if (fg[i] && from !== null) { spans.push({ from, to: t[i - 1], color: css("--grid") }); from = null; }
  }
  if (from !== null) spans.push({ from, to: t[t.length - 1], color: css("--grid") });
  return spans;
}

function performance() {
  if (!has("fps") || !S.t || !S.t.length) return;
  const sec = el("section", { class: "card" });
  sec.innerHTML = `<div class="chart-head"><h2 style="margin:0">${T("performance")}</h2>
    <div class="keys"><span><i style="background:${css("--accent")}"></i>${T("fpsSeries")}</span>
    ${D.bottleneck.cap_fps ? `<span><i style="background:${css("--b-frame_cap")}"></i>${T("capLine")}</span>` : ""}
    ${D.stutters.length ? `<span><i style="background:${css("--bad")}"></i>${T("stutterMark")}</span>` : ""}
    <span><i style="background:${css("--b-gpu")}"></i>${T("timeline")}</span></div></div>`;
  app.append(sec);
  const bIdx = S.bottleneck || [];
  Chart(sec, {
    x: S.t, height: 280, unit: "",
    series: [{ label: "FPS", values: S.fps, color: css("--accent"), width: 1.8, decimals: 0, fill: alpha(css("--accent"), 0.12) }],
    spans: backgroundSpans(),
    hLines: D.bottleneck.cap_fps ? [{ y: D.bottleneck.cap_fps, label: `${T("capLine")} ${nf(D.bottleneck.cap_fps)}`, color: css("--b-frame_cap") }] : [],
    markers: D.stutters.map((s) => ({ x: s.t, color: css("--bad") })),
    strip: { color: (i) => bColor(B_KEYS[bIdx[i]] || "mixed") },
    extraTip: (i) => {
      const row = (label, v, u) => v == null ? "" : `<div class="r">${label}<b>${nf(v)}${u}</b></div>`;
      return `<div class="r"><span class="dot" style="background:${bColor(B_KEYS[bIdx[i]] || "mixed")}"></span>${esc(bName(B_KEYS[bIdx[i]] || "mixed"))}</div>` +
        row("GPU", S.gpu_usage && S.gpu_usage[i], "%") + row("CPU", S.cpu_usage && S.cpu_usage[i], "%") +
        row(T("busiestThread"), S.game_busiest_thread && S.game_busiest_thread[i], "%");
    },
  });
}

function frametime() {
  if (!has("frametime_graph") || !D.envelope || !D.envelope.t.length) return;
  const E = D.envelope;
  const sec = el("section", { class: "card" });
  sec.innerHTML = `<div class="chart-head"><h2 style="margin:0">${T("frametime")}</h2>
    <div class="keys"><span><i style="background:${css("--accent-2")}"></i>${T("avgFt")}</span><span><i style="background:${alpha(css("--accent-2"), 0.35)};height:8px"></i>${T("envelope")}</span></div></div>`;
  app.append(sec);
  Chart(sec, {
    x: E.t, height: 220, unit: " ms", yCap: Math.max(F.ft_p999 * 2.2, F.ft_median * 4),
    band: { lo: E.min, hi: E.max, color: alpha(css("--accent-2"), 0.25) },
    series: [{ label: T("avgFt"), values: E.avg, color: css("--accent-2"), width: 1.4, decimals: 2 },
             { label: T("max"), values: E.max, color: "transparent", width: 0, decimals: 1 }],
    spans: backgroundSpans(),
  });
  const grid = el("div", { class: "grid2", style: "margin-top:18px" });
  const histo = el("div", {}, `<h3 style="margin-bottom:8px">${T("histogram")}</h3>`);
  const pctBox = el("div", {}, `<h3 style="margin-bottom:8px">${T("percentiles")}</h3>`);
  grid.append(histo, pctBox); sec.append(grid);
  const H = F.histogram || [];
  barChart(histo, { labels: H.map((b) => nf(b[0], b[0] < 10 ? 1 : 0)), values: H.map((b) => b[2]), color: css("--accent-2"), unit: "", highlight: (i) => H[i][0] >= F.ft_median * 2.5 });
  const show = [50, 90, 95, 99, 99.9, 99.99, 100];
  const rows = (F.percentiles || []).filter((p) => show.includes(p[0]));
  pctBox.innerHTML += `<table><thead><tr><th>${T("percentile")}</th><th class="n">ms</th><th class="n">FPS</th></tr></thead><tbody>${rows.map((p) => `<tr><td>p${nf(p[0], p[0] % 1 ? 2 : 0)}</td><td class="n">${nf(p[1], 2)}</td><td class="n">${nf(1000 / p[1], 1)}</td></tr>`).join("")}</tbody></table>`;
}

// One small chart per selected sensor ("small multiples").
const SENSOR_GROUPS = [
  ["gpu", [
    ["gpu_usage", "metric.gpu_usage", "%", 0, 100], ["gpu_temperature", "metric.gpu_temperature", " °C", 0], ["gpu_hotspot", "metric.gpu_hotspot", " °C", 0],
    ["gpu_core_clock", "metric.gpu_core_clock", " MHz", 0], ["gpu_memory_clock", "metric.gpu_memory_clock", " MHz", 0], ["gpu_power", "metric.gpu_power", " W", 0],
    ["gpu_voltage", "metric.gpu_voltage", " V", 3], ["gpu_fan", "metric.gpu_fan", "%", 0, 100], ["gpu_fan_rpm", "fanRpm", " rpm", 0, null, "gpu_fan"],
  ]],
  ["vram", [["vram_used_gb", "metric.vram_used_gb", " GB", 2], ["vram_usage_percent", "metric.vram_usage_percent", "%", 1, 100], ["vram_temperature", "metric.vram_temperature", " °C", 0]]],
  ["cpu", [
    ["cpu_usage", "metric.cpu_usage", "%", 0, 100], ["cpu_busiest_core", "metric.cpu_busiest_core", "%", 0, 100], ["game_busiest_thread", "busiestThread", "%", 0, 100, "cpu_busiest_core"],
    ["cpu_temperature", "metric.cpu_temperature", " °C", 0], ["cpu_clock_average", "metric.cpu_clock_average", " MHz", 0], ["cpu_clock_max", "metric.cpu_clock_max", " MHz", 0],
    ["cpu_power", "metric.cpu_power", " W", 0],
  ]],
  ["ram", [["ram_used_gb", "metric.ram_used_gb", " GB", 1], ["ram_usage_percent", "metric.ram_usage_percent", "%", 0, 100], ["game_working_set_gb", "workingSet", " GB", 1, null, "ram_used_gb"]]],
];
const METRIC_LABELS = {
  "pt-BR": { "metric.gpu_usage": "Uso", "metric.gpu_temperature": "Temperatura", "metric.gpu_hotspot": "Hotspot", "metric.gpu_core_clock": "Clock do núcleo", "metric.gpu_memory_clock": "Clock da memória", "metric.gpu_power": "Consumo", "metric.gpu_voltage": "Tensão do núcleo", "metric.gpu_fan": "Ventoinha", "metric.vram_used_gb": "Usada", "metric.vram_usage_percent": "Uso", "metric.vram_temperature": "Temperatura (junction)", "metric.cpu_usage": "Uso total", "metric.cpu_busiest_core": "Núcleo mais ocupado", "metric.cpu_temperature": "Temperatura (pacote)", "metric.cpu_clock_average": "Clock médio", "metric.cpu_clock_max": "Clock máximo (núcleo)", "metric.cpu_power": "Consumo (pacote)", "metric.ram_used_gb": "Usada", "metric.ram_usage_percent": "Uso" },
  "en": { "metric.gpu_usage": "Usage", "metric.gpu_temperature": "Temperature", "metric.gpu_hotspot": "Hotspot", "metric.gpu_core_clock": "Core clock", "metric.gpu_memory_clock": "Memory clock", "metric.gpu_power": "Power", "metric.gpu_voltage": "Core voltage", "metric.gpu_fan": "Fan", "metric.vram_used_gb": "Used", "metric.vram_usage_percent": "Usage", "metric.vram_temperature": "Temperature (junction)", "metric.cpu_usage": "Total usage", "metric.cpu_busiest_core": "Busiest core", "metric.cpu_temperature": "Temperature (package)", "metric.cpu_clock_average": "Average clock", "metric.cpu_clock_max": "Max clock (core)", "metric.cpu_power": "Power (package)", "metric.ram_used_gb": "Used", "metric.ram_usage_percent": "Usage" },
};
const label = (k) => METRIC_LABELS[LANG][k] || T(k);
const GROUP_COLORS = { gpu: "#16a34a", vram: "#9333ea", cpu: "#f59e0b", ram: "#db2777" };

function sensors() {
  const ch = D.channels || {};
  SENSOR_GROUPS.forEach(([group, metrics]) => {
    const visible = metrics.filter(([key, , , , , gate]) => has(gate || key) && S[key]);
    const limiter = group === "gpu" && has("gpu_limiter") && (S.gpu_limiter || []).some((v) => v != null);
    if (!visible.length && !limiter) return;
    const head = el("div", { class: "group-title" }, `<h2>${T(group)}</h2><div class="line"></div>`);
    app.append(head);
    const grid = el("section", { class: "grid3" });
    app.append(grid);
    visible.forEach(([key, labelKey, unit, decimals, yMax]) => {
      const c = ch[key];
      const card = el("div", { class: "card mini" });
      card.innerHTML = `<div class="top"><h3>${esc(label(labelKey))}</h3><div class="big">${c ? nf(c.avg, decimals) + unit : `<span class="na">${T("na")}</span>`}</div></div>
        <div class="stats">${c ? `<span>${T("median")} ${nf(c.median, decimals)}</span><span>${T("min")} ${nf(c.min, decimals)}</span><span>${T("max")} ${nf(c.max, decimals)}</span><span>${T("p95")} ${nf(c.p95, decimals)}</span>` : ""}</div>`;
      grid.append(card);
      if (c) Chart(card, { x: S.t, height: 110, unit: unit.trim() === "%" ? "%" : "", yMax: yMax ?? undefined, yMin: yMax === 100 ? 0 : undefined,
        series: [{ label: label(labelKey), values: S[key], color: GROUP_COLORS[group], width: 1.4, decimals, unit, fill: alpha(GROUP_COLORS[group], 0.1) }],
        spans: backgroundSpans() });
    });
    if (limiter) {
      const counts = { power: 0, thermal: 0, hw: 0, idle: 0, none: 0 }; let total = 0;
      S.gpu_limiter.forEach((v, i) => {
        if (v == null || !S.foreground[i]) return; total++;
        if (v & 2) counts.thermal++; else if (v & 4) counts.hw++; else if (v & 1) counts.power++; else if (v & 8) counts.idle++; else counts.none++;
      });
      const rows = [["power", T("limPower"), "#f59e0b"], ["thermal", T("limThermal"), "#dc2626"], ["hw", T("limHw"), "#9333ea"], ["idle", T("limIdle"), "#94a3b8"], ["none", T("limNone"), "#16a34a"]]
        .filter(([k]) => counts[k] > 0);
      const card = el("div", { class: "card mini" });
      card.innerHTML = `<div class="top"><h3>${T("limiter")}</h3></div>
        <div class="sharebar" style="margin-top:12px">${rows.map(([k, , c]) => `<div style="width:${counts[k] / total * 100}%;background:${c}"></div>`).join("")}</div>
        <div class="legend">${rows.map(([k, l, c]) => `<div class="row"><span class="dot" style="background:${c}"></span>${l}<span class="pct">${nf(counts[k] / total * 100)}%</span></div>`).join("")}</div>`;
      grid.append(card);
    }
  });
}

function energy() {
  const E = D.energy;
  const sec = el("section", { class: "card" });
  const parts = [];
  if (E.gpu.measured) parts.push({ value: E.gpu.wh, color: GROUP_COLORS.gpu, label: T("gpuEnergy") });
  if (E.cpu.measured) parts.push({ value: E.cpu.wh, color: GROUP_COLORS.cpu, label: T("cpuEnergy") });
  const wh = E.total_wh || 0;
  sec.innerHTML = `<h2>${T("energyTitle")}</h2><div class="energy"><div class="donut-host"></div><div>
    <div class="facts">
      ${[["gpu", E.gpu, T("gpuEnergy")], ["cpu", E.cpu, T("cpuEnergy")]].map(([k, c, l]) => `<div class="fact"><div class="l"><span class="dot" style="display:inline-block;background:${GROUP_COLORS[k]};margin-right:6px"></span>${l}</div>
        <div class="v">${c.measured ? nf(c.wh, c.wh < 100 ? 1 : 0) + " Wh" : `<span class="na">${T("notMeasured")}</span>`}</div>
        <div class="l">${c.measured ? `${T("avgPower")} ${nf(c.avg_w)} W · ${T("peakPower")} ${nf(c.peak_w)} W` : ""}</div></div>`).join("")}
      <div class="fact"><div class="l">${T("fpsPerWatt")}</div><div class="v">${E.fps_per_watt ? nf(E.fps_per_watt, 2) : T("na")}</div><div class="l">${T("avgPower")} ${nf(E.avg_w)} W</div></div>
      <div class="fact"><div class="l">${T("mjPerFrame")}</div><div class="v">${E.mj_per_frame ? energyPerFrame(E.mj_per_frame) : T("na")}</div><div class="l">${nf(F.count)} ${T("frames")}</div></div>
    </div>
    <p class="fun">${wh > 0 ? [T("funPhone", nf(wh / 15, 1)), T("funShower", nf(wh / 5500 * 60, 1)), T("funLed", nf(wh / 9, 1))].join(" · ") : ""}</p>
    <p class="faint" style="font-size:12px;margin:6px 0 0">${T("measuredOnly")}</p>
  </div></div>`;
  app.append(sec);
  donut(sec.querySelector(".donut-host"), parts.length ? parts : [{ value: 1, color: css("--surface-2") }],
    `<div><strong class="num">${nf(wh, wh < 100 ? 1 : 0)}</strong><span class="muted">Wh ${T("total")}</span></div>`);
}

function stutterTable() {
  const sec = el("section", { class: "card" });
  if (!D.stutters.length) {
    sec.innerHTML = `<h2>${T("stutterList")}</h2><p class="muted" style="margin:0">${T("noStutters")}</p>`;
    app.append(sec); return;
  }
  const worst = Math.max(...D.stutters.map((s) => s.ms));
  const rows = D.stutters.slice().sort((a, b) => b.ms - a.ms).slice(0, 100).sort((a, b) => a.t - b.t);
  sec.innerHTML = `<h2>${T("stutterList")} · ${nf(D.stutters.length)}</h2><div class="scroll"><table>
    <thead><tr><th>${T("time")}</th><th class="n">${T("frameMs")}</th><th style="width:22%"></th><th class="n">${T("localMedian")}</th><th>${T("atThatMoment")}</th><th class="n">GPU</th><th class="n">CPU</th><th class="n">${T("busiestThread")}</th><th class="n">VRAM</th></tr></thead>
    <tbody>${rows.map((s) => `<tr><td class="num">${fmtT(s.t)}</td><td class="n"><b>${nf(s.ms, 1)} ms</b></td>
      <td><div class="sev" style="width:${Math.max(6, s.ms / worst * 100)}%"></div></td><td class="n">${nf(s.median_ms, 1)} ms</td>
      <td><span class="dot" style="display:inline-block;background:${bColor(s.bottleneck)};margin-right:6px"></span>${esc(bName(s.bottleneck))}</td>
      <td class="n">${s.gpu_usage == null ? "–" : nf(s.gpu_usage) + "%"}</td><td class="n">${s.cpu_usage == null ? "–" : nf(s.cpu_usage) + "%"}</td>
      <td class="n">${s.thread == null ? "–" : nf(s.thread) + "%"}</td><td class="n">${s.vram_gb == null ? "–" : nf(s.vram_gb, 1) + " GB"}</td></tr>`).join("")}</tbody></table></div>`;
  app.append(sec);
}

function details() {
  const rows = [
    [T("exe"), info.exe_path || info.exe_name], [T("window"), info.window_title],
    [T("monitor"), info.monitor_name ? `${info.monitor_name} · ${info.monitor_width}×${info.monitor_height} @ ${info.monitor_hz} Hz` : ""],
    [T("api"), info.present_api], [T("vsync"), info.sync_interval < 0 ? T("na") : info.sync_interval === 0 ? T("vsyncOff") : `${T("vsyncOn")} (${info.sync_interval})`],
    [T("hardware"), [hw.cpu_name, hw.cpu_threads ? `${hw.cpu_threads} ${T("threads")}` : "", hw.gpu_name, hw.gpu_power_limit_w ? `${nf(hw.gpu_power_limit_w)} W TGP` : "", hw.os].filter(Boolean).join(" · ")],
    [T("sources"), `GPU: ${info.gpu_source || T("na")} · CPU: ${info.cpu_sensor_source || T("na")} · FPS: ETW`],
    [T("interval"), `${nf(info.sample_interval_sec * 1000)} ms`], [T("etwLost"), nf(info.etw_events_lost)],
    [T("generated"), `${D.app} ${D.version}`],
  ].filter(([, v]) => v);
  const sec = el("section", { class: "card" });
  sec.innerHTML = `<h2>${T("details")}</h2><dl class="details">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <p class="faint" style="font-size:12px;margin:14px 0 0">${esc(T("method"))}</p>`;
  app.append(sec);
}

hero();
kpis();
verdict();
performance();
frametime();
sensors();
app.append(el("div", { style: "height:8px" }));
energy();
stutterTable();
details();
app.append(el("footer", {}, `PerfPulse ${esc(D.version)} · ${esc(start.toLocaleString(LANG))}`));
})();
</script>
